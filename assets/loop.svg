<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="420" viewBox="0 0 1180 420" role="img" aria-label="GigiLoop cycle diagram">
  <defs>
    <linearGradient id="accent2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1de9ff"/>
      <stop offset="1" stop-color="#7c5cff"/>
    </linearGradient>
    <linearGradient id="gold2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd23f"/>
      <stop offset="1" stop-color="#ff8a00"/>
    </linearGradient>
    <style>
      .node { fill:#0e1530; stroke:url(#accent2); stroke-width:2.5; }
      .lbl  { font-family:'Segoe UI',Helvetica,Arial,sans-serif; fill:#eaf1ff; font-weight:700; }
      .sub  { font-family:'Segoe UI',Helvetica,Arial,sans-serif; fill:#9fb2d8; font-weight:500; }
      .arr  { stroke:#7c5cff; stroke-width:3; fill:none; }
    </style>
  </defs>

  <rect width="1180" height="420" fill="#0a0f1f"/>
  <rect width="1180" height="420" fill="#1de9ff" fill-opacity="0.03"/>

  <!-- nodes -->
  <g>
    <rect class="node" x="40"  y="150" width="170" height="120" rx="16"/>
    <text class="lbl" x="125" y="195" text-anchor="middle" font-size="22">A · WORK</text>
    <text class="sub" x="125" y="222" text-anchor="middle" font-size="14">fix top flaw</text>

    <rect class="node" x="285" y="150" width="170" height="120" rx="16"/>
    <text class="lbl" x="370" y="195" text-anchor="middle" font-size="22">B · TEST</text>
    <text class="sub" x="370" y="222" text-anchor="middle" font-size="14">real suite + guard</text>

    <rect class="node" x="530" y="150" width="170" height="120" rx="16"/>
    <text class="lbl" x="615" y="195" text-anchor="middle" font-size="22">C · SCORE</text>
    <text class="sub" x="615" y="222" text-anchor="middle" font-size="14">0–10, w/ proof</text>

    <rect class="node" x="775" y="150" width="170" height="120" rx="16"/>
    <text class="lbl" x="860" y="195" text-anchor="middle" font-size="22">D · RED-TEAM</text>
    <text class="sub" x="860" y="222" text-anchor="middle" font-size="14">≥3 flaws + test</text>

    <rect class="node" x="1015" y="150" width="125" height="120" rx="16"/>
    <text class="lbl" x="1077" y="195" text-anchor="middle" font-size="22">E · DECIDE</text>
    <text class="sub" x="1077" y="222" text-anchor="middle" font-size="14">next / re-plan</text>
  </g>

  <!-- forward arrows -->
  <g class="arr">
    <path d="M210 210 H282"/>
    <path d="M455 210 H527"/>
    <path d="M700 210 H772"/>
    <path d="M945 210 H1012"/>
    <polygon points="282,210 270,204 270,216" fill="#7c5cff"/>
    <polygon points="527,210 515,204 515,216" fill="#7c5cff"/>
    <polygon points="772,210 760,204 760,216" fill="#7c5cff"/>
    <polygon points="1012,210 1000,204 1000,216" fill="#7c5cff"/>
  </g>

  <!-- feedback loop back to WORK -->
  <path d="M1015 250 C 1015 360 300 360 130 272" class="arr" stroke-dasharray="7 7"/>
  <polygon points="130,272 143,268 139,281" fill="#7c5cff"/>

  <!-- success branch to final gate -->
  <g>
    <path d="M1077 150 C 1077 70 615 70 615 44" class="arr" stroke="url(#gold2)"/>
    <polygon points="615,44 622,57 608,57" fill="#ff8a00"/>
    <rect x="500" y="8" width="230" height="40" rx="12" fill="#0e1530" stroke="url(#gold2)" stroke-width="2.5"/>
    <text x="615" y="34" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="800" fill="#ffd23f">FINAL GATE ≥9/10</text>
  </g>

  <text x="590" y="395" text-anchor="middle" class="sub" font-size="15">every criterion ≥ 9/10 → FINAL GATE · else loop back and fix the top flaw</text>
</svg>
