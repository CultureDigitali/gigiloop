name: Validate GigiLoop

on:
  workflow_dispatch:
  push:
    paths:
      - 'gigiloop/**'
      - 'tests/**'
      - 'adapters/**'
      - '.cursor/rules/gigiloop.mdc'
      - 'COMPATIBILITY.md'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'assets/**'
      - '.github/workflows/validate-skill.yml'
  pull_request:
    paths:
      - 'gigiloop/**'
      - 'tests/**'
      - 'adapters/**'
      - '.cursor/rules/gigiloop.mdc'
      - 'COMPATIBILITY.md'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'assets/**'
      - '.github/workflows/validate-skill.yml'

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile runtime
        run: python -m py_compile gigiloop/scripts/gigiloop.py

      - name: Runtime self-test
        run: python gigiloop/scripts/gigiloop.py self-test

      - name: Runtime regression suite
        run: python -m unittest discover -s tests -v

      - name: Validate repository and skill invariants
        run: python gigiloop/scripts/gigiloop.py validate-repo

      - name: Build deterministic skill package
        run: python gigiloop/scripts/gigiloop.py pack --output dist/skill.zip

      - name: Verify deterministic packaging and executable runtime bit
        run: |
          cp dist/skill.zip /tmp/skill-first.zip
          python gigiloop/scripts/gigiloop.py pack --output dist/skill.zip
          cmp /tmp/skill-first.zip dist/skill.zip
          python - <<'PY'
          import zipfile
          with zipfile.ZipFile('dist/skill.zip') as z:
              info = z.getinfo('gigiloop/scripts/gigiloop.py')
              mode = (info.external_attr >> 16) & 0o777
              assert mode & 0o111, oct(mode)
          PY
          sha256sum dist/skill.zip

      - name: Archive exact source revision
        run: git archive --format=zip --output=dist/gigiloop-source.zip HEAD

      - uses: actions/upload-artifact@v4
        with:
          name: gigiloop-${{ github.sha }}
          path: |
            dist/skill.zip
            dist/gigiloop-source.zip
          if-no-files-found: error
          retention-days: 14
