name: Validate skill

on:
  push:
    paths:
      - 'gigiloop/**'
      - 'adapters/**'
      - '.cursor/rules/gigiloop.mdc'
      - 'COMPATIBILITY.md'
      - 'assets/logo-v2.svg'
      - 'assets/banner-v2.svg'
      - '.github/workflows/validate-skill.yml'
  pull_request:
    paths:
      - 'gigiloop/**'
      - 'adapters/**'
      - '.cursor/rules/gigiloop.mdc'
      - 'COMPATIBILITY.md'
      - 'assets/logo-v2.svg'
      - 'assets/banner-v2.svg'
      - '.github/workflows/validate-skill.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate SKILL.md, references, adapters, and branding
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          skill = Path('gigiloop/SKILL.md')
          text = skill.read_text(encoding='utf-8')
          if not text.startswith('---\n'):
              raise SystemExit('SKILL.md must start with YAML frontmatter')
          m = re.match(r'^---\n(.*?)\n---\n', text, re.S)
          if not m:
              raise SystemExit('Invalid YAML frontmatter delimiters')
          fm = m.group(1)
          if not re.search(r'^name:\s+gigiloop\s*$', fm, re.M):
              raise SystemExit('Expected name: gigiloop')
          if not re.search(r'^description:\s+.+$', fm, re.M):
              raise SystemExit('Missing description')

          required = [
              'gigiloop/references/scoring.md',
              'gigiloop/references/checkpoint.md',
              'gigiloop/references/verification.md',
              'gigiloop/references/hosts.md',
              'gigiloop/agents/openai.yaml',
              'COMPATIBILITY.md',
              'adapters/codex/AGENTS.md',
              'adapters/gemini-cli/GEMINI.md',
              '.cursor/rules/gigiloop.mdc',
              'assets/logo-v2.svg',
              'assets/banner-v2.svg',
          ]
          for item in required:
              if not Path(item).exists():
                  raise SystemExit(f'Missing required file: {item}')

          for ref in ['references/scoring.md', 'references/checkpoint.md', 'references/verification.md']:
              if ref not in text:
                  raise SystemExit(f'SKILL.md does not reference {ref}')

          for svg in ['assets/logo-v2.svg', 'assets/banner-v2.svg']:
              data = Path(svg).read_text(encoding='utf-8')
              if '<svg' not in data or '</svg>' not in data:
                  raise SystemExit(f'Invalid SVG asset: {svg}')

          print('GigiLoop multihost validation passed')
          PY
