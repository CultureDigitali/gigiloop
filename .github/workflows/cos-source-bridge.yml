name: Temporary Chat On Steroids Source Bridge

on:
  push:
    branches:
      - "tmp/cos-source-bridge"

jobs:
  package-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout official Chat On Steroids source
        uses: actions/checkout@v4
        with:
          repository: totec448-spec/chat-on-steroids
          ref: main
          path: source
          fetch-depth: 1

      - name: Record source commit
        run: |
          git -C source rev-parse HEAD > source-commit.txt
          tar -C source -czf chat-on-steroids-source.tar.gz --exclude=.git .

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: chat-on-steroids-source
          path: |
            chat-on-steroids-source.tar.gz
            source-commit.txt
          compression-level: 0
          retention-days: 1
