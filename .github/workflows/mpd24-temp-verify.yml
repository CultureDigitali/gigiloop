name: Temporary MPD24-AI Verification

on:
  push:
    branches:
      - "tmp/rust-toolchain-bridge"

jobs:
  verify-mpd24:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux audio and Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tmp-mpd24-ai/package-lock.json
      - name: Install frontend dependencies
        working-directory: tmp-mpd24-ai
        run: npm ci
      - name: Run complete gate
        working-directory: tmp-mpd24-ai
        run: bash ./scripts/verify-app.sh
