name: Apply verified GigiLoop v0.5 bundle

on:
  push:
    branches:
      - feat/v0.4.0-verifiable-runtime
    paths:
      - 'staging/v05/trigger.txt'

permissions:
  contents: write

concurrency:
  group: apply-v05-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and authenticate verified bundle
        run: |
          cat staging/v05/part*.txt | base64 -d > /tmp/v05-bundle.tar.gz
          echo '0b45bccb2f2b2789a5c701410ff1d2ae8fecce651005484931d59b36b8fdf2bf  /tmp/v05-bundle.tar.gz' | sha256sum -c -
          tar -xzf /tmp/v05-bundle.tar.gz -C .
          chmod +x gigiloop/scripts/gigiloop.py

      - name: Update changelog
        run: |
          python - <<'PY'
          from pathlib import Path
          changelog = Path('CHANGELOG.md')
          section = Path('V05_CHANGELOG.md').read_text(encoding='utf-8').strip()
          text = changelog.read_text(encoding='utf-8')
          marker = '## [Unreleased]'
          if section not in text:
              if marker not in text:
                  raise SystemExit('CHANGELOG marker not found')
              text = text.replace(marker, marker + '\n\n' + section, 1)
              changelog.write_text(text, encoding='utf-8')
          PY

      - name: Verify exact v0.5 candidate before commit
        run: |
          test "$(sha256sum gigiloop/scripts/gigiloop.py | cut -d' ' -f1)" = '47a644e19e6e3c091108efd21f5f1c648b5e64c3f66840fccc8df22ef79d3365'
          test "$(sha256sum tests/test_runtime.py | cut -d' ' -f1)" = 'bcb4382cc279d3156c03b8fcd15440d473208a5d0276d2e0ddd970991f29bd37'
          python -m py_compile gigiloop/scripts/gigiloop.py
          python gigiloop/scripts/gigiloop.py self-test
          python -m unittest discover -s tests -v
          python gigiloop/scripts/gigiloop.py validate-repo
          python gigiloop/scripts/gigiloop.py pack --output /tmp/skill.zip

      - name: Commit verified candidate and remove staging machinery
        run: |
          rm -f V05_CHANGELOG.md
          rm -rf staging/v05
          rm -f .github/workflows/apply-v05.yml
          git config user.name 'Culture Digitali GigiLoop Bot'
          git config user.email '124262825+CultureDigitali@users.noreply.github.com'
          git add -A
          git commit -m 'GigiLoop v0.5.0: harden runtime and local verification'
          git push origin HEAD:feat/v0.4.0-verifiable-runtime
