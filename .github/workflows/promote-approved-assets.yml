name: Finalize approved GigiLoop assets

on:
  push:
    branches:
      - polish/approved-visuals-v0.3.1

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: polish/approved-visuals-v0.3.1
          fetch-depth: 0
      - name: Promote and lock approved renders
        shell: bash
        run: |
          set -euo pipefail

          if [ -d .probe ]; then
            echo '9042e8b31e7ef514aeb459bcbf2601a791340cf70f3ef1749f83beb9ef50f157  .probe/banner.jpg' | sha256sum -c -
            echo '67f3733445edfd7992cccba30a1eada1463e5a30f8462dc47e0daeae8eb40eae  .probe/compat.jpg' | sha256sum -c -
            echo 'c07eda5c8557983d757ca48a7988fd3d4b2bb1f80ce8937cd6d27dfa071e5af4  .probe/logo.jpg' | sha256sum -c -

            mkdir -p assets gigiloop/assets
            cp .probe/banner.jpg assets/gigiloop-superbanner.jpg
            cp .probe/compat.jpg assets/gigiloop-compatibility.jpg
            cp .probe/logo.jpg assets/gigiloop-logo.jpg
            cp .probe/logo.jpg gigiloop/assets/gigiloop-logo.jpg
            rm -rf .probe
          fi

          echo '9042e8b31e7ef514aeb459bcbf2601a791340cf70f3ef1749f83beb9ef50f157  assets/gigiloop-superbanner.jpg' | sha256sum -c -
          echo '67f3733445edfd7992cccba30a1eada1463e5a30f8462dc47e0daeae8eb40eae  assets/gigiloop-compatibility.jpg' | sha256sum -c -
          echo 'c07eda5c8557983d757ca48a7988fd3d4b2bb1f80ce8937cd6d27dfa071e5af4  assets/gigiloop-logo.jpg' | sha256sum -c -
          echo 'c07eda5c8557983d757ca48a7988fd3d4b2bb1f80ce8937cd6d27dfa071e5af4  gigiloop/assets/gigiloop-logo.jpg' | sha256sum -c -

          rm -f .github/workflows/probe-assets.yml
          rm -f .github/workflows/promote-approved-assets.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Approved assets already finalized.'
            exit 0
          fi
          git commit -m 'Finalize approved GigiLoop rendered assets'
          git push origin HEAD:polish/approved-visuals-v0.3.1
