[workspace]
resolver = "2"
members = [
  "crates/common",
  "crates/midi-engine",
  "crates/audio-engine",
  "crates/sequencer",
  "crates/groove-engine",
  "crates/jev-engine",
  "crates/project-store",
  "apps/desktop/src-tauri",
]

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
